# Every push and pull request: the tests, not the release artifacts.
# Release packaging lives in release.yml and is triggered deliberately.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'
  PYTHON_VERSION: '3.12'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      # Real process, real HTTP, real SQLite, restart and PDF export.
      - run: python scripts/smoke_backend.py

  # The whole chain, end to end, from a clean checkout: case -> program -> AST
  # -> IR -> plan -> enrolled endpoints -> evidence -> correlation -> threads
  # -> timeline -> findings -> report -> evidence package. The unit suites can
  # all pass while the pieces fail to fit together, which is exactly what this
  # caught when it was first run.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the end-to-end demo
        run: python scripts/demo.py --output demo-output
      - name: Check the evidence package is complete
        run: |
          set -euo pipefail
          for file in investigator-report.pdf report.json program.jocky ir.json \
                      execution-plan.json endpoint-tasks.json \
                      cross-host-correlation.json audit-trail.json; do
            test -s "demo-output/$file" || { echo "missing: $file"; exit 1; }
          done
          for scenario in A B C D E F; do
            test -s "demo-output/synthetic-scenarios/scenario-$scenario.json" \
              || { echo "missing scenario $scenario"; exit 1; }
          done
          head -c 4 demo-output/investigator-report.pdf | grep -q '%PDF'
      - name: Every synthetic record must be labelled synthetic
        run: |
          set -euo pipefail
          python - <<'CHECK'
          import json, pathlib, sys
          for path in sorted(pathlib.Path("demo-output/synthetic-scenarios").glob("*.json")):
              payload = json.loads(path.read_text())
              assert payload["synthetic"] is True, path
              assert "SYNTHETIC" in payload["banner"], path
              for event in payload["source"]["execution"]["events"]:
                  assert event["synthetic"] is True, path
                  assert event["source"].startswith("SYNTHETIC"), path
          print("every synthetic record is labelled")
          CHECK
      - uses: actions/upload-artifact@v4
        with:
          name: demo-evidence-package
          path: |
            demo-output/investigator-report.pdf
            demo-output/program.jocky
            demo-output/ir.json
            demo-output/execution-plan.json
            demo-output/cross-host-correlation.json
            demo-output/audit-trail.json
          retention-days: 14

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: flutter_client
        run: flutter pub get
      - working-directory: flutter_client
        run: flutter analyze
      # The packaged-engine test skips itself when no release bundle is present,
      # which is the case here; release.yml runs it against a real bundle.
      - working-directory: flutter_client
        run: flutter test

  # Two genuinely separate Linux environments. The previous pass validated
  # cross-host correlation with two agents on one machine and said so; this is
  # the thing that closes that gap, so it runs on every push rather than being
  # something someone remembers to do.
  multihost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Real two-host validation
        run: python validation/multihost.py --output validation-output
      - name: The correlation must name both hosts, and the non-match neither
        run: |
          python - <<'CHECK'
          import json, pathlib
          report = json.loads(
              pathlib.Path("validation-output/multihost-validation.json").read_text())
          assert report["result"] == "PASSED", report.get("error")
          assert report["hostnames"]["endpoint-a"] != report["hostnames"]["endpoint-b"]
          matched = {item["value"]: item for item in report["correlation"]["correlations"]}
          shared = matched[report["shared_sha256"]]
          assert set(shared["endpoints"]) == set(report["hostnames"].values()), shared
          assert report["unique_sha256"] not in matched, (
              "a file on one host only was reported as a cross-host match")
          assert report["limitations"], "the validation must state what it does not establish"
          print(f"two hosts, {report['correlation']['correlation_count']} correlation(s), "
                "non-match verified")
          CHECK
      - uses: actions/upload-artifact@v4
        with:
          name: multihost-validation
          path: validation-output/multihost-validation.json
          retention-days: 14

  # A boundary that is only stated in a document is not a boundary. These are
  # the properties the product's whole premise rests on, so they are checked on
  # every push rather than only in the suites a change might not run.
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: The security boundary tests
        run: |
          python -m pytest -q \
            tests/test_plan_execution.py \
            tests/test_fleet.py \
            tests/test_casework_api.py \
            tests/test_casework.py
      - name: No collector may be reachable except through the registry
        run: |
          python - <<'CHECK'
          import importlib, sys
          from backend import plan_runner
          from compiler.plan import LinuxAdapter, WindowsAdapter

          # Every collector a plan can name must be in the registry, and the
          # registry entry must hold the very function the path names.
          for source, (function, dotted, _action) in plan_runner.REGISTRY.items():
              module, _, attribute = dotted.rpartition(".")
              assert getattr(importlib.import_module(module), attribute) is function, source

          # An adapter must not offer a source the registry cannot run, unless
          # the local collector owns it outright.
          for adapter in (LinuxAdapter, WindowsAdapter):
              for source in adapter.supported:
                  assert source in plan_runner.REGISTRY, f"{adapter.name} offers {source}"
          print(f"{len(plan_runner.REGISTRY)} collectors, all registry-bound")
          CHECK
      - name: Nothing may put a command on the wire to an endpoint
        run: |
          python - <<'CHECK'
          import re, pathlib
          from backend.storage import MIGRATIONS

          # The agent must contain no way to execute anything at all.
          forbidden = re.compile(r"(subprocess|os\.system|eval\(|exec\(|popen)")
          agent = pathlib.Path("endpoint/agent.py").read_text()
          offending = [line.strip() for line in agent.splitlines() if forbidden.search(line)]
          assert not offending, f"the agent must not execute anything: {offending}"

          # The task queue must have no column a command could be carried in.
          ddl = " ".join(s for group in MIGRATIONS.values() for s in group)
          table = ddl[ddl.index("CREATE TABLE endpoint_tasks"):]
          table = table[:table.index(")")]
          for word in ("command", "script", "shell", "exec", "payload"):
              assert word not in table.lower(), f"endpoint_tasks has a {word} column"

          # And a dispatched task must carry only these keys.
          allowed = {"task_id", "source", "collector", "arguments", "options", "attempt"}
          claim = pathlib.Path("backend/fleet.py").read_text()
          body = claim[claim.index("claimed.append("):]
          keys = set(re.findall(r'"(\w+)":', body[:body.index("})")]))
          assert keys <= allowed, f"a dispatched task carries unexpected keys: {keys - allowed}"
          print("no execution path in the agent, no command column, no command key")
          CHECK
