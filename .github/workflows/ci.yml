# Every push and pull request: the tests, not the release artifacts.
# Release packaging lives in release.yml and is triggered deliberately.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'
  PYTHON_VERSION: '3.12'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      # Real process, real HTTP, real SQLite, restart and PDF export.
      - run: python scripts/smoke_backend.py

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: flutter_client
        run: flutter pub get
      - working-directory: flutter_client
        run: flutter analyze
      # The packaged-engine test skips itself when no release bundle is present,
      # which is the case here; release.yml runs it against a real bundle.
      - working-directory: flutter_client
        run: flutter test
