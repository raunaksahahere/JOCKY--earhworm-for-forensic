# Linux release artifacts, built on a native runner.
#
# PyInstaller freezes for the OS it runs on and Flutter desktop builds are
# native, so neither target can be cross-built. Windows is built, validated and
# published by .github/workflows/windows.yml; both attach their assets to the
# release for the same tag.
#
# Never triggered by an ordinary push. Run it from the Actions tab, or push a
# v* tag to build and publish a release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (x.y.z)'
        required: true
        default: '0.9.0'
      targets:
        description: 'Which platforms to build (Windows lives in windows.yml)'
        type: choice
        options: [linux]
        default: linux
      publish:
        description: 'Create a GitHub Release with the artifacts'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # Pinned to the toolchain this repository is developed and tested against.
  FLUTTER_VERSION: '3.47.2'
  PYTHON_VERSION: '3.12'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Version must be x.y.z, got '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    # A tag builds everything; a manual run builds only what was asked for, so
    # one platform can ship while the other is still being brought up.
    if: github.event_name != 'workflow_dispatch' || inputs.targets == 'linux'
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Backend tests
        run: python -m pytest -q

      - name: Freeze the engine
        run: python scripts/build_backend.py

      - name: Engine integration smoke test
        run: python scripts/smoke_backend.py --executable backend-dist/jocky-backend/jocky-backend

      # Runs flutter pub get, analyze, test, the release build, and verifies the
      # engine is inside the bundle.
      - name: Build the release bundle
        run: bash packaging/linux/build.sh

      # The packaged-engine test starts the real bundled engine through the real
      # locator, so a bundle that cannot start its own engine fails the release.
      - name: Verify the bundle starts its own engine
        working-directory: flutter_client
        run: xvfb-run -a flutter test test/integration/packaged_engine_test.dart

      - name: Build the Debian package
        env:
          JOCKY_VERSION: ${{ needs.version.outputs.version }}
        run: bash packaging/linux/build_deb.sh

      - name: Verify the package installs and carries the engine
        env:
          JOCKY_VERSION: ${{ needs.version.outputs.version }}
        run: |
          sudo dpkg -i "build/deb/jocky_${JOCKY_VERSION}_amd64.deb"
          test -x /opt/jocky-workstation/jocky_client
          test -x /opt/jocky-workstation/backend/jocky-backend
          test -d /opt/jocky-workstation/backend/_internal
          sudo dpkg -r jocky

      - name: Install the package in a clean environment and use it there
        # The check above installs on the runner, which already has Python, the
        # libraries and the source tree, so it can only confirm the files are
        # where the packaging says. This installs into a container that has none
        # of them and then uses the installed engine: collection, both reports,
        # a review brief and the evidence package. A package that runs on the
        # machine that built it has proved nothing.
        env:
          JOCKY_VERSION: ${{ needs.version.outputs.version }}
        run: bash validation/clean_install.sh "build/deb/jocky_${JOCKY_VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: jocky-linux-deb
          path: build/deb/*.deb
          if-no-files-found: error

  publish:
    # Only for a v* tag, or an explicit request. Building never publishes.
    #
    # This workflow owns the Linux asset. Windows is built, validated and
    # published by windows.yml, which attaches its assets to the same release
    # for the same tag: two workflows producing the same artifact would race,
    # and Windows takes three times as long, so keeping them separate lets the
    # Linux release land while Windows is still packaging.
    if: >-
      !cancelled()
      && (github.ref_type == 'tag' || inputs.publish)
      && needs.linux.result == 'success'
    needs: [version, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: JOCKY ${{ needs.version.outputs.version }}
          # Published, not a draft. Reaching this job is already deliberate: it
          # runs only for a v* tag or an explicit publish request, and only when
          # every platform that was asked for succeeded.
          draft: false
          fail_on_unmatched_files: false
          files: |
            artifacts/*.deb
